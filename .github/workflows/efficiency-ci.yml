name: Render Intelligence CI

on:
  push:
  pull_request:

jobs:
  efficiency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and import v2.5 runtime
        run: |
          python -m compileall -q .
          python -c "import app, comicframe_efficiency, comicframe_workspace, comicframe_reference_lock"
      - name: Smoke-test performance policies
        run: |
          python - <<'PY'
          from comicframe_efficiency import difficulty_score, difficulty_tier, policy_for

          assert difficulty_tier(0.20) == 'easy'
          assert difficulty_tier(0.55) == 'moderate'
          assert difficulty_tier(0.90) == 'hard'
          assert difficulty_score(.9, .8, .9, 'Locked') > difficulty_score(.1, .1, .2, 'Normal')
          assert policy_for('Fast', 'hard')['long_edge'] == 768
          assert policy_for('Balanced', 'easy')['steps'] == 18
          assert policy_for('Balanced', 'hard')['long_edge'] == 1024
          assert policy_for('Quality', 'hard')['steps'] == 30
          bypass = policy_for('Balanced', 'easy', original=True)
          assert bypass['gpu'] is False and bypass['steps'] == 0 and bypass['long_edge'] == 0
          PY
      - name: Smoke-test source difficulty metrics
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from comicframe_efficiency import source_frame_metrics

          root = Path('/tmp/efficiency_metrics')
          root.mkdir(parents=True, exist_ok=True)
          flat = []
          busy = []
          for n in range(3):
              p = root / f'flat_{n}.png'
              Image.new('RGB', (320, 180), (40 + n, 40 + n, 40 + n)).save(p)
              flat.append(p)
          for n in range(3):
              p = root / f'busy_{n}.png'
              im = Image.new('RGB', (320, 180), (15, 15, 15))
              d = ImageDraw.Draw(im)
              for x in range(0, 320, 12):
                  d.line((x + n * 4, 0, (x + 120 + n * 7) % 320, 179), fill=(240, 240, 240), width=3)
              im.save(p)
              busy.append(p)
          flat_motion, flat_detail = source_frame_metrics(flat)
          busy_motion, busy_detail = source_frame_metrics(busy)
          assert busy_detail > flat_detail, (busy_detail, flat_detail)
          assert busy_motion > flat_motion, (busy_motion, flat_motion)
          PY
      - name: Smoke-test raw optical-flow cache reuse
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import cv2
          from comicframe_efficiency import RenderIntelligenceMixin

          class Var:
              def __init__(self, value=''): self.value = value
              def get(self): return self.value
              def set(self, value): self.value = value

          class Harness(RenderIntelligenceMixin):
              def project_paths(self):
                  return {'flow_cache': self.root / 'flow'}
              def after(self, _delay, callback): callback()

          obj = object.__new__(Harness)
          obj.root = Path('/tmp/efficiency_flow')
          obj._transport_cache_mem = {}
          obj._transport_cache_order = []
          obj._flow_cache_hits = 0
          obj._flow_cache_misses = 0
          obj.efficiency_flow_status_var = Var()

          prev = np.zeros((96, 160), dtype=np.uint8)
          cv2.rectangle(prev, (35, 25), (80, 70), 220, -1)
          cur = np.zeros_like(prev)
          cv2.rectangle(cur, (40, 25), (85, 70), 220, -1)
          flow1, confidence1 = obj._estimate_transport(prev, cur, quality=False, confidence_floor=.45)
          flow2, confidence2 = obj._estimate_transport(prev, cur, quality=False, confidence_floor=.35)
          assert flow1.shape == flow2.shape == (96, 160, 2)
          assert confidence1.shape == confidence2.shape == (96, 160)
          assert obj._flow_cache_misses == 1, obj._flow_cache_misses
          assert obj._flow_cache_hits == 1, obj._flow_cache_hits
          assert list((obj.root / 'flow').glob('*.npz'))
          assert float(confidence2.mean()) >= float(confidence1.mean())
          PY
      - name: Smoke-test adaptive step cap
        run: |
          python - <<'PY'
          from dataclasses import dataclass
          from comicframe_efficiency import RenderIntelligenceMixin

          @dataclass
          class Settings:
              steps: int

          class FakeBase:
              def _apply_frame_direction(self, style_name, intensity, settings):
                  return settings, {}

          class Harness(RenderIntelligenceMixin, FakeBase): pass
          obj = object.__new__(Harness)
          obj._efficiency_active_directive = {'mode': 'Balanced', 'steps': 18}
          directed, _ = obj._apply_frame_direction('x', .5, Settings(steps=30))
          assert directed.steps == 18
          obj._efficiency_active_directive = {'mode': 'Quality', 'steps': 30}
          directed, _ = obj._apply_frame_direction('x', .5, Settings(steps=24))
          assert directed.steps == 30
          PY
      - name: Smoke-test one-frame OOM downgrade
        run: |
          python - <<'PY'
          from pathlib import Path
          from comicframe_efficiency import RenderIntelligenceMixin

          class Var:
              def __init__(self, value): self.value = value
              def get(self): return self.value
              def set(self, value): self.value = value

          class FakeBase:
              def _render_one(self, frame_path, out_path, settings, width, height, frame_number):
                  self.calls += 1
                  self.seen.append((self.inference_mode_var.get(), self.control_low_vram_var.get()))
                  if self.calls == 1:
                      raise RuntimeError('CUDA out of memory while allocating tensor')
                  Path(out_path).write_bytes(b'ok')
                  return 'ok'

          class Harness(RenderIntelligenceMixin, FakeBase):
              def _directive_for_frame(self, frame_number):
                  return {'mode': 'Balanced', 'tier': 'hard', 'long_edge': 1024, 'resolution': '1024 long edge · fast / stable', 'steps': 26, 'flow_quality': False, 'gpu': True}
              def _log(self, *_): pass

          obj = object.__new__(Harness)
          obj.inference_mode_var = Var('1024 long edge · fast / stable')
          obj.temporal_engine_var = Var('Optical Flow · Fast')
          obj.control_low_vram_var = Var(False)
          obj.efficiency_oom_retry_var = Var(True)
          obj._efficiency_active_directive = None
          obj._efficiency_retry_count = 0
          obj.calls = 0
          obj.seen = []
          target = Path('/tmp/efficiency_retry.png')
          result = obj._render_one(None, target, None, 1920, 1080, 5)
          assert result == 'ok'
          assert obj.calls == 2
          assert obj.seen[0][0].startswith('1024')
          assert obj.seen[1][0].startswith('768')
          assert obj.seen[1][1] is True
          assert obj.inference_mode_var.get().startswith('1024')
          assert obj.control_low_vram_var.get() is False
          assert obj._efficiency_retry_count == 1
          PY
      - name: Smoke-test efficiency-aware selective invalidation
        run: |
          python - <<'PY'
          from pathlib import Path
          from comicframe_efficiency import RenderIntelligenceMixin, efficiency_frame_signature

          class FakeBase:
              def _invalidate_changed_timeline_frames(self, old, new): return 999

          class Harness(RenderIntelligenceMixin, FakeBase):
              def project_paths(self): return {'root': self.root, 'styled': self.root / 'styled_frames'}

          root = Path('/tmp/efficiency_resume')
          styled = root / 'styled_frames'
          styled.mkdir(parents=True, exist_ok=True)
          for n in range(1, 7):
              (styled / f'frame_{n:06d}.png').write_bytes(b'x')
          base_shots = [
              {'id': 1, 'start': 1, 'end': 3, 'style': 'Clean Graphic Novel', 'intensity_start': .5, 'intensity_end': .5, 'curve': 'linear', 'subject_lock': 'Strong', 'reference_frame': 2, 'reference_backend_resolved': 'Shot Memory', 'reference_model': '', 'render_intelligence': {'tier': 'easy', 'long_edge': 768, 'steps': 18}},
              {'id': 2, 'start': 4, 'end': 6, 'style': 'Neo-Noir', 'intensity_start': .6, 'intensity_end': .6, 'curve': 'linear', 'subject_lock': 'Strong', 'reference_frame': 5, 'reference_backend_resolved': 'Shot Memory', 'reference_model': '', 'render_intelligence': {'tier': 'moderate', 'long_edge': 1024, 'steps': 22}},
          ]
          old = {'total_frames': 6, 'render_intelligence': {'mode': 'Balanced'}, 'shots': [dict(base_shots[0]), dict(base_shots[1])]}
          new = {'total_frames': 6, 'render_intelligence': {'mode': 'Balanced'}, 'shots': [dict(base_shots[0]), dict(base_shots[1])]}
          new['shots'][1] = dict(new['shots'][1])
          new['shots'][1]['render_intelligence'] = {'tier': 'moderate', 'long_edge': 768, 'steps': 19}
          assert efficiency_frame_signature(old, 2) == efficiency_frame_signature(new, 2)
          assert efficiency_frame_signature(old, 5) != efficiency_frame_signature(new, 5)
          obj = object.__new__(Harness)
          obj.root = root
          changed = obj._invalidate_changed_timeline_frames(old, new)
          assert changed == 3, changed
          assert all((styled / f'frame_{n:06d}.png').exists() for n in (1,2,3))
          assert all(not (styled / f'frame_{n:06d}.png').exists() for n in (4,5,6))
          legacy = {'total_frames': 6, 'shots': old['shots']}
          assert obj._invalidate_changed_timeline_frames(legacy, new) == 999
          PY
      - name: Smoke-test v2.4 profile compatibility normalization
        run: |
          python - <<'PY'
          from app import ComicFrameStudioApp

          old = {'app_version': '2.4', 'checkpoint': 'JuggernautXL', 'workspace': {'version': '2.4'}}
          new = {'app_version': '2.5', 'checkpoint': 'JuggernautXL', 'workspace': {'version': '2.4'}, 'render_intelligence': {'mode': 'Balanced'}}
          assert ComicFrameStudioApp._profile_without_director(old) == ComicFrameStudioApp._profile_without_director(new)
          new['checkpoint'] = 'DifferentXL'
          assert ComicFrameStudioApp._profile_without_director(old) != ComicFrameStudioApp._profile_without_director(new)
          PY
