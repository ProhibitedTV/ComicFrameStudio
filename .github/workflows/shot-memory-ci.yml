name: Shot Memory CI

on:
  push:
  pull_request:

jobs:
  shot-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and import v2.0 runtime
        run: |
          python -m compileall -q .
          python -c "import app, comicframe_shot_memory, comicframe_optical_flow"
      - name: Smoke-test pre-diffusion shot memory and ControlNet source isolation
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          import numpy as np
          from PIL import Image, ImageChops

          from comicframe_optical_flow import FLOW_FAST, OpticalFlowTemporalMixin
          from comicframe_shot_memory import ShotMemoryMixin

          class Var:
              def __init__(self, value): self.value = value
              def get(self): return self.value
              def set(self, value): self.value = value

          class FakeBase:
              def _build_payload(self, frame_path, settings, width, height, frame_number):
                  source_b64 = base64.b64encode(Path(frame_path).read_bytes()).decode('ascii')
                  return {
                      'init_images': [source_b64],
                      'width': width,
                      'height': height,
                      'alwayson_scripts': {
                          'controlnet': {'args': [{'image': source_b64}]}
                      },
                  }

              def project_paths(self):
                  return {'root': self._root, 'frames': self._root / 'frames', 'styled': self._root / 'styled_frames', 'test': self._root / 'test_frames'}

          class Harness(ShotMemoryMixin, OpticalFlowTemporalMixin, FakeBase):
              pass

          root = Path('/tmp/comicframe_shot_memory_smoke')
          frames = root / 'frames'
          styled = root / 'styled_frames'
          frames.mkdir(parents=True, exist_ok=True)
          styled.mkdir(parents=True, exist_ok=True)

          rng = np.random.default_rng(2020)
          prev = rng.integers(0, 256, size=(96, 160, 3), dtype=np.uint8)
          cur = np.zeros_like(prev)
          cur[:, 5:] = prev[:, :-5]
          Image.fromarray(prev, 'RGB').save(frames / 'frame_000001.png')
          Image.fromarray(cur, 'RGB').save(frames / 'frame_000002.png')

          prior_style = np.zeros_like(prev)
          prior_style[..., 0] = 245
          Image.fromarray(prior_style, 'RGB').save(styled / 'frame_000001.png')
          Image.new('RGB', (160, 96), (0, 0, 230)).save(styled / 'frame_000002.png')

          obj = object.__new__(Harness)
          obj._root = root
          obj.shot_memory_enabled_var = Var(True)
          obj.shot_memory_strength_var = Var(0.32)
          obj.shot_palette_strength_var = Var(0.0)
          obj.shot_anchor_interval_var = Var(24)
          obj.shot_memory_confidence_var = Var(0.05)
          obj.shot_memory_status_var = Var('')
          obj.temporal_engine_var = Var(FLOW_FAST)
          obj.temporal_cut_var = Var(0.22)
          obj._shot_memory_scope = 'full'
          obj._shot_memory_outdir = styled
          obj._shot_memory_start_frame = 1
          obj._shot_memory_manifest = {'version': '2.0', 'anchors': []}
          obj._shot_memory_cut_frames = set()
          obj._shot_memory_last_applied_frame = None
          obj.preset_var = Var('Video Fidelity · RTX 3060')
          obj._log = lambda *_: None

          source_b64 = base64.b64encode((frames / 'frame_000002.png').read_bytes()).decode('ascii')
          payload = obj._build_payload(frames / 'frame_000002.png', None, 160, 96, 2)

          assert payload['alwayson_scripts']['controlnet']['args'][0]['image'] == source_b64, 'ControlNet source must remain untouched'
          assert payload['init_images'][0] != source_b64, 'img2img init should carry transported style memory'
          assert obj._shot_memory_last_applied_frame == 2

          conditioned_path = root / 'conditioned.png'
          conditioned_path.write_bytes(base64.b64decode(payload['init_images'][0]))
          source_image = Image.open(frames / 'frame_000002.png').convert('RGB')
          conditioned = Image.open(conditioned_path).convert('RGB')
          assert conditioned.size == source_image.size
          assert ImageChops.difference(source_image, conditioned).getbbox() is not None

          obj._record_shot_anchor(frames / 'frame_000002.png', styled / 'frame_000002.png', 2)
          anchors = obj._shot_memory_manifest['anchors']
          assert len(anchors) == 1, anchors
          assert anchors[0]['frame'] == 2
          assert anchors[0]['shot'] == 1
          assert (root / 'shot_memory' / 'full' / 'references' / anchors[0]['file']).exists()
          assert (root / 'shot_memory' / 'full' / 'manifest.json').exists()
          PY
      - name: Smoke-test deterministic palette anchor transfer
        run: |
          python - <<'PY'
          import numpy as np
          from comicframe_shot_memory import ShotMemoryMixin

          source = np.full((48, 64, 3), (80, 120, 170), dtype=np.uint8)
          anchor = np.full((48, 64, 3), (190, 90, 55), dtype=np.uint8)
          one = ShotMemoryMixin._palette_match(source, anchor, 0.20)
          two = ShotMemoryMixin._palette_match(source, anchor, 0.20)
          assert np.array_equal(one, two)
          assert not np.array_equal(one, source)
          assert one.shape == source.shape
          PY
