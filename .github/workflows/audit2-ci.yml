name: Second Audit CI

on:
  push:
  pull_request:

jobs:
  audit2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile v2.9 runtime
        run: python -m compileall -q app.py comicframe_runtime_v28.py comicframe_runtime_v29.py comicframe_media.py tests
      - name: Import stable entrypoint
        run: python -c "import app; assert app.ComicFrameStudioApp.__module__ == 'comicframe_runtime_v29'"
      - name: Run second-audit regression tests
        run: python -m pytest -q tests/test_audit2.py tests/test_hardening.py
