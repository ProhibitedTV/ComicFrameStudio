name: Second Audit CI

on:
  push:
  pull_request:

jobs:
  audit2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile sealed runtime
        run: python -m compileall -q app.py comicframe_runtime_v28.py comicframe_runtime_v29.py comicframe_stability.py comicframe_usability.py comicframe_simple.py comicframe_interface.py comicframe_presence.py comicframe_aggro.py comicframe_media.py comicframe_manifest_safety.py tests
      - name: Import stable entrypoint
        run: python -c "import app; assert app.ComicFrameStudioApp.__module__ == 'comicframe_aggro'"
      - name: Run second-audit regression tests
        run: python -m pytest -q tests/test_audit2.py tests/test_stability.py tests/test_hardening.py tests/test_usability.py tests/test_simple_flow.py tests/test_interface.py tests/test_presence.py tests/test_aggro.py
