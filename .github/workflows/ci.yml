name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Import canonical runtime
        run: python -c "import app, comicframe_app, comicframe_ui, comicframe_studio, comicframe_fx, comicframe_controlnet, comicframe_controlnet_compat, comicframe_preflight, comicframe_video_lock, comicframe_styles"
      - name: Smoke-test ControlNet v3 payload enums
        run: |
          python - <<'PY'
          from comicframe_controlnet_compat import normalize_controlnet_payload

          payload = {
              'alwayson_scripts': {
                  'controlnet': {
                      'args': [{
                          'control_mode': 0,
                          'resize_mode': 0,
                      }]
                  }
              }
          }
          normalize_controlnet_payload(payload)
          unit = payload['alwayson_scripts']['controlnet']['args'][0]
          assert unit['control_mode'] == 'Balanced', unit
          assert unit['resize_mode'] == 'Just Resize', unit
          PY
      - name: Smoke-test style packs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from comicframe_styles import STYLE_PACKS, PUBLIC_STYLE_PRESETS, apply_style_finish

          required = {
              'Clean Graphic Novel', 'Neo-Noir', 'Cyberpunk Print', 'Pulp Horror',
              'Retro 70s Print', 'Manga Motion', 'Dream Collapse',
              'Corporate Propaganda', 'Analog Broadcast', 'Video Fidelity · RTX 3060'
          }
          assert required.issubset(STYLE_PACKS), sorted(required - set(STYLE_PACKS))
          assert set(STYLE_PACKS) == set(PUBLIC_STYLE_PRESETS)
          for name, pack in STYLE_PACKS.items():
              assert 0.0 <= pack.control_weight <= 2.0, name
              assert 0.0 <= pack.guidance_end <= 1.0, name
              assert 0.0 <= pack.temporal_strength <= 0.75, name
              assert 0.0 <= pack.fx <= 1.0, name
              assert pack.steps > 0, name

          path = Path('/tmp/comicframe_style_smoke.png')
          Image.new('RGB', (160, 90), (180, 80, 40)).save(path)
          before = Image.open(path).copy()
          apply_style_finish(path, 'Neo-Noir', 1)
          after = Image.open(path).convert('RGB')
          assert after.size == before.size
          r, g, b = after.getpixel((20, 20))
          assert r == g == b, (r, g, b)
          PY
      - name: Smoke-test graphic print finish
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from comicframe_fx import GraphicFXSettings, apply_graphic_fx

          path = Path('/tmp/comicframe_fx_smoke.png')
          im = Image.new('RGB', (320, 180), 'white')
          draw = ImageDraw.Draw(im)
          draw.rectangle((30, 30, 150, 150), fill=(35, 90, 220))
          draw.ellipse((170, 35, 285, 150), fill=(230, 70, 90))
          im.save(path)
          apply_graphic_fx(path, GraphicFXSettings(enabled=True, intensity=0.85), frame_number=1)
          out = Image.open(path)
          assert out.size == (320, 180)
          assert out.mode == 'RGB'
          PY
      - name: Smoke-test motion-aware temporal lock
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from comicframe_video_lock import ControlNetFirstVideoMixin

          class Var:
              def __init__(self, value): self.value = value
              def get(self): return self.value

          root = Path('/tmp/comicframe_temporal_smoke')
          frames = root / 'frames'
          styled = root / 'styled_frames'
          frames.mkdir(parents=True, exist_ok=True)
          styled.mkdir(parents=True, exist_ok=True)

          Image.new('RGB', (96, 64), (100, 100, 100)).save(frames / 'frame_000001.png')
          Image.new('RGB', (96, 64), (100, 100, 100)).save(frames / 'frame_000002.png')
          Image.new('RGB', (96, 64), (255, 0, 0)).save(styled / 'frame_000001.png')
          Image.new('RGB', (96, 64), (0, 0, 255)).save(styled / 'frame_000002.png')

          obj = object.__new__(ControlNetFirstVideoMixin)
          obj.temporal_enabled_var = Var(True)
          obj.temporal_strength_var = Var(0.35)
          obj.temporal_motion_var = Var(0.08)
          obj.temporal_cut_var = Var(0.22)
          obj._log = lambda *_: None
          obj._temporal_lock(frames / 'frame_000002.png', styled / 'frame_000002.png', 2)

          pixel = Image.open(styled / 'frame_000002.png').getpixel((10, 10))
          assert pixel[0] > 0, pixel
          assert pixel[2] < 255, pixel
          PY
