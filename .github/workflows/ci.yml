name: CI

on:
  push:

concurrency:
  group: comicframe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile repository
        run: python -m compileall -q .
      - name: Import canonical product and engine
        run: |
          python - <<'PY'
          import app
          import comicframe_product
          import comicframe_simple
          import comicframe_runtime_v28
          import comicframe_runtime_v29
          import comicframe_stability
          import comicframe_usability
          import comicframe_reference_lock
          import comicframe_subjects
          import comicframe_shot_memory
          import comicframe_optical_flow
          import comicframe_efficiency
          import comicframe_autopilot
          import comicframe_webui_contract
          assert app.ComicFrameStudioApp is comicframe_product.ComicFrameStudioApp
          assert app.main.__module__ == "comicframe_product"
          PY
      - name: Run regression suite
        run: python -m pytest -q
      - name: Smoke ControlNet payload compatibility
        run: |
          python - <<'PY'
          from comicframe_controlnet_compat import normalize_controlnet_payload
          payload = {"alwayson_scripts": {"controlnet": {"args": [{"control_mode": 0, "resize_mode": 0}]}}}
          normalize_controlnet_payload(payload)
          unit = payload["alwayson_scripts"]["controlnet"]["args"][0]
          assert unit["control_mode"] == "Balanced"
          assert unit["resize_mode"] == "Just Resize"
          PY
      - name: Smoke public style registry
        run: |
          python - <<'PY'
          import comicframe_simple as simple
          import comicframe_styles as styles
          import comicframe_style_library as library

          library.register_style_library()
          catalog = simple.simple_process_catalog()
          assert len(catalog) >= 55
          assert "Toxic Xerox" in catalog
          assert "Chrome Nightmare" in catalog
          assert styles.STYLE_PACKS["Chrome Nightmare"].finish == "albumart"
          assert styles.STYLE_PACKS["Neon Ruin"].finish == "glitchcollapse"
          for name in catalog:
              if name in simple.SEQUENCE_PROCESSES:
                  continue
              pack = styles.STYLE_PACKS[name]
              assert 0.0 <= pack.denoise <= 0.95, name
              assert 0.0 <= pack.fx <= 1.0, name
              assert 0.0 <= pack.guidance_end <= 1.0, name
              assert "decisive authored reinterpretation" in pack.prompt, name
          PY
