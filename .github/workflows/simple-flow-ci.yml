name: Simple Flow CI

on:
  push:
  pull_request:

jobs:
  simple-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile simple product shell
        run: python -m compileall -q app.py comicframe_simple.py comicframe_interface.py comicframe_presence.py tests/test_simple_flow.py tests/test_interface.py tests/test_presence.py
      - name: Import stable entrypoint
        run: python -c "import app; assert app.ComicFrameStudioApp.__module__ == 'comicframe_presence'"
      - name: Run simple-flow regression tests
        run: python -m pytest -q tests/test_simple_flow.py tests/test_interface.py tests/test_presence.py tests/test_usability.py
