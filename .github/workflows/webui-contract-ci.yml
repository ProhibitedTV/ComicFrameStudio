name: WebUI Contract CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and import v2.1 runtime
        run: |
          python -m compileall -q .
          python -c "import app, comicframe_webui_contract"
      - name: Smoke-test A1111 and Forge error envelopes
        run: |
          python - <<'PY'
          from comicframe_webui_contract import WebUIContractMixin

          class FakeResponse:
              def __init__(self, data, status=422):
                  self._data = data
                  self.status_code = status
                  self.text = ''
              def json(self):
                  return self._data

          a1111 = FakeResponse({
              'error': 'ValidationError',
              'detail': 'bad control unit',
              'body': {'alwayson_scripts': 'controlnet'},
              'errors': 'value is not valid',
          })
          forge = FakeResponse({
              'error': 'RuntimeError',
              'detail': 'Sampler not found',
              'body': '',
              'message': 'generation rejected',
          }, 400)

          one = WebUIContractMixin._response_error_text(a1111)
          two = WebUIContractMixin._response_error_text(forge)
          assert 'bad control unit' in one and 'value is not valid' in one, one
          assert 'Sampler not found' in two and 'generation rejected' in two, two

          normalized = WebUIContractMixin._normalize_runtime_error(
              'Stable Diffusion API HTTP 422: {"detail":"bad unit","error":"ValidationError"}'
          )
          assert normalized and 'HTTP 422' in normalized and 'bad unit' in normalized, normalized
          PY
      - name: Smoke-test atomic API image decode
        run: |
          python - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          from comicframe_webui_contract import WebUIContractMixin

          # Backends encode according to their configured sample format. Feed a
          # JPEG response and prove ComicFrame stores a verified real PNG.
          buf = BytesIO()
          Image.new('RGB', (80, 48), (23, 117, 201)).save(buf, format='JPEG', quality=90)
          encoded = base64.b64encode(buf.getvalue()).decode('ascii')
          target = Path('/tmp/contract_frame.png')
          WebUIContractMixin._save_api_image(encoded, target)
          assert target.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          with Image.open(target) as image:
              image.verify()
          assert not Path(str(target) + '.part').exists()

          # data:image URI is also accepted by both upstream decoders.
          target2 = Path('/tmp/contract_data_uri.png')
          WebUIContractMixin._save_api_image('data:image/jpeg;base64,' + encoded, target2)
          assert target2.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          PY
      - name: Smoke-test capability-driven payload contract
        run: |
          python - <<'PY'
          from comicframe_webui_contract import WebUIContractMixin

          class Parent:
              def _build_payload(self, *args, **kwargs):
                  return {'scheduler': 'Karras', 'batch_size': 7, 'n_iter': 3}

          class Harness(WebUIContractMixin, Parent):
              pass

          obj = object.__new__(Harness)
          obj._webui_capabilities = {'schedulers': False}
          payload = obj._build_payload(None, None, 1, 1, 1)
          assert 'scheduler' not in payload, payload
          assert payload['send_images'] is True
          assert payload['save_images'] is False
          assert payload['include_init_images'] is False
          assert payload['batch_size'] == 1 and payload['n_iter'] == 1

          obj._webui_capabilities = {'schedulers': True}
          payload = obj._build_payload(None, None, 1, 1, 1)
          assert payload['scheduler'] == 'Karras', payload
          PY
      - name: Smoke-test checkpoint identity normalization
        run: |
          python - <<'PY'
          from comicframe_webui_contract import WebUIContractMixin

          match = WebUIContractMixin._checkpoint_matches
          assert match('JuggernautXL_v9.safetensors [abc123]', 'JuggernautXL_v9')
          assert match(r'C:\models\foo.safetensors [1234]', 'foo.safetensors')
          assert not match('model_a [111]', 'model_b [222]')
          PY
