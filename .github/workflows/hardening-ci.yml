name: Runtime Hardening CI

on:
  push:
  pull_request:

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile canonical runtime
        run: python -m compileall -q app.py comicframe_hardening.py comicframe_manifest_safety.py tests
      - name: Run hardening regression tests
        run: python -m pytest -q tests/test_hardening.py
