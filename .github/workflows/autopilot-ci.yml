name: AutoPilot CI

on:
  push:
  pull_request:

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and import v2.7 runtime
        run: |
          python -m compileall -q .
          python -c "import app, comicframe_autopilot, comicframe_subjects, comicframe_efficiency"

      - name: Smoke-test AutoPilot MRO
        run: |
          python - <<'PY'
          from app import ComicFrameStudioApp
          from comicframe_autopilot import AutoPilotMixin
          from comicframe_subjects import SubjectLibraryMixin
          from comicframe_efficiency import RenderIntelligenceMixin
          from comicframe_reference_lock import ReferenceLockMixin
          mro = ComicFrameStudioApp.mro()
          assert mro.index(AutoPilotMixin) < mro.index(SubjectLibraryMixin)
          assert mro.index(SubjectLibraryMixin) < mro.index(RenderIntelligenceMixin)
          assert mro.index(RenderIntelligenceMixin) < mro.index(ReferenceLockMixin)
          PY

      - name: Smoke-test creative guardrails
        run: |
          python - <<'PY'
          from comicframe_autopilot import autopilot_style_guard, autopilot_subject_threshold
          assert autopilot_style_guard(.9, 1.0, 'Safe') < .9
          assert autopilot_style_guard(.9, 1.0, 'Balanced') < .9
          assert autopilot_style_guard(.9, 1.0, 'Wild') == .9
          assert autopilot_subject_threshold('Safe') > autopilot_subject_threshold('Balanced')
          assert autopilot_subject_threshold('Balanced') > autopilot_subject_threshold('Wild')
          PY

      - name: Smoke-test deterministic subject clustering
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image
          from comicframe_autopilot import cluster_representatives, representative_similarity
          root = Path('/tmp/autopilot_cluster'); root.mkdir(parents=True, exist_ok=True)
          y, x = np.mgrid[0:120, 0:160]
          a = np.stack([(x * 255 // 159), (y * 255 // 119), ((x+y) * 255 // 278)], axis=-1).astype('uint8')
          b = a.copy()
          c = np.flip(a, axis=1).copy()
          for name, arr in [('a.png', a), ('b.png', b), ('c.png', c)]: Image.fromarray(arr).save(root / name)
          assert representative_similarity(root/'a.png', root/'b.png') > .99
          groups = cluster_representatives([(3, root/'c.png'), (1, root/'a.png'), (2, root/'b.png')], .98)
          assert groups == [[1, 2]], groups
          assert groups == cluster_representatives([(1, root/'a.png'), (2, root/'b.png'), (3, root/'c.png')], .98)
          PY

      - name: Smoke-test output sanity detector
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image
          from comicframe_autopilot import verify_image_sanity
          root = Path('/tmp/autopilot_sanity'); root.mkdir(parents=True, exist_ok=True)
          rng = np.random.default_rng(7)
          good = root/'good.png'; blank = root/'blank.png'
          Image.fromarray(rng.integers(0, 256, (256, 256, 3), dtype=np.uint8)).save(good)
          Image.new('RGB', (256,256), (0,0,0)).save(blank)
          assert verify_image_sanity(good)[0] is True
          assert verify_image_sanity(blank)[0] is False
          PY

      - name: Smoke-test deterministic automatic subject IDs
        run: |
          python - <<'PY'
          from comicframe_autopilot import AutoPilotMixin
          class Harness(AutoPilotMixin):
              def _source_fingerprint(self): return 'fixed-source'
          obj = object.__new__(Harness)
          a = obj._autopilot_group_subject_id([7, 2, 4])
          b = obj._autopilot_group_subject_id([4, 7, 2])
          c = obj._autopilot_group_subject_id([2, 4])
          assert a == b and a.startswith('auto_')
          assert a != c
          PY

      - name: Smoke-test bounded optional-reference fallback
        run: |
          python - <<'PY'
          from comicframe_autopilot import AutoPilotMixin
          class Var:
              def __init__(self, value): self.value=value
              def get(self): return self.value
              def set(self, value): self.value=value
          class Harness(AutoPilotMixin):
              def _log(self, *_): pass
          obj = object.__new__(Harness)
          obj.reference_backend_override_var = Var('Auto')
          calls=[]
          def action():
              calls.append(obj.reference_backend_override_var.get())
              if len(calls)==1: raise RuntimeError('IP-Adapter model failed')
              return 'ok'
          assert obj._with_reference_fallback(action) == 'ok'
          assert calls == ['Auto', 'Shot Memory']
          assert obj.reference_backend_override_var.get() == 'Auto'
          PY

      - name: Smoke-test one-click render call chain
        run: |
          python - <<'PY'
          from comicframe_autopilot import AutoPilotMixin
          class Var:
              def __init__(self, value): self.value=value
              def get(self): return self.value
              def set(self, value): self.value=value
          class Harness(AutoPilotMixin):
              def _autopilot_prepare(self): self.calls.append('prepare'); return {'shots':[{'id':1}]}, {'auto_subjects':0}
              def _autopilot_quality_probe(self, timeline): self.calls.append('probe'); return {'passed':True}
              def _render_range(self, start, count, test): self.calls.append(('render',start,count,test))
              def _autopilot_verify_final(self): self.calls.append('verify'); return {'file':'/tmp/FINAL_STYLED.mp4','width':1920,'height':1080}
              def _set_progress(self, *_): pass
              def _workspace_refresh_all(self): self.calls.append('refresh')
              def _workspace_show_error(self, exc): raise AssertionError(exc)
              def after(self, _delay, callback): callback()
          obj = object.__new__(Harness)
          obj.calls=[]
          obj.autopilot_probe_var=Var(True)
          obj.autopilot_status_var=Var('')
          obj._autopilot_active=False
          obj._autopilot_render_job()
          assert obj.calls == ['prepare','probe',('render',1,None,False),'verify','refresh'], obj.calls
          assert 'RENDER COMPLETE' in obj.autopilot_status_var.get()
          assert obj._autopilot_active is False
          PY

      - name: Smoke-test v2.6 cache compatibility normalization
        run: |
          python - <<'PY'
          from app import ComicFrameStudioApp
          old = {
              'app_version':'2.6', 'checkpoint':'JuggernautXL',
              'subject_library':{'version':'2.6'}, 'render_intelligence':{'mode':'Balanced'}
          }
          new = {
              'app_version':'2.7', 'checkpoint':'JuggernautXL',
              'subject_library':{'version':'2.6'}, 'render_intelligence':{'mode':'Balanced'},
              'autopilot':{'version':'2.7','mode':'Balanced'}
          }
          assert ComicFrameStudioApp._profile_without_director(old) == ComicFrameStudioApp._profile_without_director(new)
          new['checkpoint']='DifferentXL'
          assert ComicFrameStudioApp._profile_without_director(old) != ComicFrameStudioApp._profile_without_director(new)
          PY
