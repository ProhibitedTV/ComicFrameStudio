name: Reference Lock CI

on:
  push:
  pull_request:

jobs:
  reference-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and import v2.3 runtime
        run: |
          python -m compileall -q .
          python -c "import app, comicframe_reference_lock, comicframe_director, comicframe_shot_memory"
      - name: Smoke-test backend capability selection
        run: |
          python - <<'PY'
          from comicframe_reference_lock import ReferenceLockMixin, BACKEND_IP, BACKEND_MEMORY, BACKEND_REFERENCE

          class Var:
              def __init__(self, value): self.value = value
              def get(self): return self.value
              def set(self, value): self.value = value

          class Harness(ReferenceLockMixin):
              def _direct_controlnet_inventory(self):
                  return (
                      ['controlnet-canny-sdxl', 'ip-adapter-plus_sdxl_vit-h [abc123]'],
                      ['canny', 'ip-adapter-auto', 'reference_only'],
                  )
              def _looks_sdxl(self, name): return True
              def _log(self, *_): pass
              def after(self, _delay, callback): callback()

          obj = object.__new__(Harness)
          obj.checkpoint_var = Var('JuggernautXL')
          obj.control_model_combo = {'values': []}
          obj.control_module_combo = {'values': []}
          obj.reference_status_var = Var('')
          obj.reference_backend_override_var = Var('Auto')
          obj._reference_caps = {}
          caps = obj._refresh_reference_capabilities()
          assert caps['ip_adapter'] is True
          assert caps['reference_only'] is True
          backend, module, model = obj._choose_reference_backend('Strong')
          assert backend == BACKEND_IP
          assert module == 'ip-adapter-auto'
          assert 'sdxl' in model.lower()

          obj.reference_backend_override_var.set(BACKEND_REFERENCE)
          backend, module, model = obj._choose_reference_backend('Strong')
          assert backend == BACKEND_REFERENCE
          assert module == 'reference_only'
          assert model == 'None'

          obj._reference_caps = {'ip_adapter': False, 'reference_only': False, 'shot_memory': True}
          obj.reference_backend_override_var.set('Auto')
          assert obj._choose_reference_backend('Strong')[0] == BACKEND_MEMORY
          PY
      - name: Smoke-test shot-local reference candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from comicframe_reference_lock import ReferenceLockMixin

          class Harness(ReferenceLockMixin):
              def project_paths(self): return {'frames': self.root / 'frames'}

          root = Path('/tmp/reference_candidates')
          frames = root / 'frames'
          frames.mkdir(parents=True, exist_ok=True)
          for n in range(1, 31):
              value = (n * 7) % 255
              Image.new('RGB', (128, 72), (value, value // 2, 255 - value)).save(frames / f'frame_{n:06d}.png')

          obj = object.__new__(Harness)
          obj.root = root
          shot = {'id': 2, 'start': 11, 'end': 20}
          candidates = obj._score_reference_candidates(shot)
          assert candidates
          assert all(11 <= n <= 20 for n in candidates), candidates
          assert len(candidates) == len(set(candidates))
          PY
      - name: Smoke-test separate reference unit and Canny isolation
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image
          from comicframe_reference_lock import ReferenceLockMixin, BACKEND_IP

          class Var:
              def __init__(self, value): self.value = value
              def get(self): return self.value
              def set(self, value): self.value = value

          class FakeBase:
              @staticmethod
              def _encode_file(path): return base64.b64encode(Path(path).read_bytes()).decode('ascii')
              def _load_director_timeline(self, silent=True): return self._director_timeline
              def project_paths(self): return {'frames': self.root / 'frames'}
              def _build_payload(self, frame_path, settings, width, height, frame_number):
                  source = self._encode_file(frame_path)
                  return {
                      'init_images': [source],
                      'alwayson_scripts': {
                          'controlnet': {'args': [{
                              'enabled': True,
                              'module': 'canny',
                              'model': 'controlnet-canny-sdxl',
                              'image': source,
                              'weight': 0.95,
                          }]}
                      }
                  }

          class Harness(ReferenceLockMixin, FakeBase):
              pass

          root = Path('/tmp/reference_payload')
          frames = root / 'frames'
          frames.mkdir(parents=True, exist_ok=True)
          current = frames / 'frame_000002.png'
          reference = frames / 'frame_000001.png'
          Image.new('RGB', (96, 64), (10, 20, 30)).save(reference)
          Image.new('RGB', (96, 64), (90, 80, 70)).save(current)

          obj = object.__new__(Harness)
          obj.root = root
          obj._director_timeline = {'shots': [{
              'id': 1, 'start': 1, 'end': 3, 'style': 'Clean Graphic Novel',
              'subject_lock': 'Strong', 'reference_frame': 1,
              'reference_backend_resolved': BACKEND_IP,
              'reference_module': 'ip-adapter-auto',
              'reference_model': 'ip-adapter-plus_sdxl_vit-h [abc]',
          }]}
          obj.control_low_vram_var = Var(False)
          obj._reference_caps = {}
          obj._reference_last_backend = ''

          payload = obj._build_payload(current, None, 96, 64, 2)
          args = payload['alwayson_scripts']['controlnet']['args']
          assert len(args) == 2
          current_b64 = base64.b64encode(current.read_bytes()).decode('ascii')
          reference_b64 = base64.b64encode(reference.read_bytes()).decode('ascii')
          assert args[0]['module'] == 'canny'
          assert args[0]['image'] == current_b64
          assert args[1]['module'] == 'ip-adapter-auto'
          assert args[1]['image'] == reference_b64
          assert args[1]['save_detected_map'] is False
          assert args[1]['weight'] == 0.62
          assert args[0]['image'] != args[1]['image']
          PY
      - name: Smoke-test Strong vs Locked and Shot Memory fallback
        run: |
          python - <<'PY'
          from comicframe_reference_lock import ReferenceLockMixin, BACKEND_IP, BACKEND_MEMORY

          assert ReferenceLockMixin._reference_weight('Strong', BACKEND_IP) < ReferenceLockMixin._reference_weight('Locked', BACKEND_IP)

          class Var:
              def __init__(self, value): self.value = value
              def get(self): return self.value
              def set(self, value): self.value = value

          class FakeBase:
              def _load_director_timeline(self, silent=True): return self._director_timeline
              def _build_payload(self, *args, **kwargs):
                  self.observed_memory = self.shot_memory_strength_var.get()
                  self.observed_palette = self.shot_palette_strength_var.get()
                  return {'init_images': ['x']}

          class Harness(ReferenceLockMixin, FakeBase): pass
          obj = object.__new__(Harness)
          obj._director_timeline = {'shots': [{
              'id': 1, 'start': 1, 'end': 3, 'style': 'Clean Graphic Novel',
              'subject_lock': 'Locked', 'reference_backend_resolved': BACKEND_MEMORY,
          }]}
          obj.shot_memory_strength_var = Var(0.18)
          obj.shot_palette_strength_var = Var(0.10)
          obj._reference_last_backend = ''
          obj._build_payload(None, None, 64, 64, 2)
          assert obj.observed_memory >= 0.44
          assert obj.observed_palette >= 0.22
          assert obj.shot_memory_strength_var.get() == 0.18
          assert obj.shot_palette_strength_var.get() == 0.10
          PY
      - name: Smoke-test reference-aware selective invalidation
        run: |
          python - <<'PY'
          from pathlib import Path
          from comicframe_reference_lock import ReferenceLockMixin, reference_plan_signature

          class Harness(ReferenceLockMixin):
              def project_paths(self):
                  return {'root': self.root, 'styled': self.root / 'styled_frames'}

          root = Path('/tmp/reference_resume')
          styled = root / 'styled_frames'
          styled.mkdir(parents=True, exist_ok=True)
          for n in range(1, 7):
              (styled / f'frame_{n:06d}.png').write_bytes(b'x')

          old = {'total_frames': 6, 'shots': [
              {'id': 1, 'start': 1, 'end': 3, 'style': 'Clean Graphic Novel', 'intensity_start': .5, 'intensity_end': .5, 'curve': 'linear', 'subject_lock': 'Strong', 'reference_frame': 2, 'reference_backend_resolved': 'Shot Memory', 'reference_model': ''},
              {'id': 2, 'start': 4, 'end': 6, 'style': 'Neo-Noir', 'intensity_start': .6, 'intensity_end': .6, 'curve': 'linear', 'subject_lock': 'Strong', 'reference_frame': 5, 'reference_backend_resolved': 'Shot Memory', 'reference_model': ''},
          ]}
          new = {'total_frames': 6, 'shots': [dict(old['shots'][0]), dict(old['shots'][1])]}
          new['shots'][1]['reference_frame'] = 6

          assert reference_plan_signature(old, 2) == reference_plan_signature(new, 2)
          assert reference_plan_signature(old, 5) != reference_plan_signature(new, 5)

          obj = object.__new__(Harness)
          obj.root = root
          invalidated = obj._invalidate_changed_timeline_frames(old, new)
          assert invalidated == 3, invalidated
          assert all((styled / f'frame_{n:06d}.png').exists() for n in (1, 2, 3))
          assert all(not (styled / f'frame_{n:06d}.png').exists() for n in (4, 5, 6))
          PY
